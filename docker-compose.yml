services:
  db:
    container_name: db-game
    image: postgres:18.2
    env_file:
      - .env
    volumes:
      - db_data:/var/lib/postgresql

  api:
    container_name: api-game
    build:
      context: ./api
      dockerfile: Dockerfile
      target: production
    env_file:
      - .env
    depends_on:
      - db
    restart: unless-stopped
    networks:
      - default
      - proxy

  web:
    container_name: web-game
    image: nginx:alpine
    volumes:
      - ./web:/usr/share/nginx/html:ro
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    restart: unless-stopped
    networks:
      - default
      - proxy

volumes:
  db_data:
    driver: local

networks:
  proxy:
    external: true
    name: stack-serveur_default
